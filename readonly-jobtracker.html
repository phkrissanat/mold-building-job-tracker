<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ดูสถานะงานต้นแบบ &amp; แม่พิมพ์ (Read Only)</title>
<link rel="manifest" href="manifest-jobtracker-readonly.json">
<meta name="theme-color" content="#020c18">
<link rel="apple-touch-icon" href="icons/icon-jobtracker-ro-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ต้องวางไฟล์นี้ไว้โฟลเดอร์เดียวกับ firebase-config.js ของโปรเจกต์นี้ (ที่ต้องมี window.MOLD_OWNER_UID ตั้งไว้ด้วย) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg:#020c18;
    --panel:#05121f;
    --panel2:#081a2c;
    --border:rgba(0,229,255,.16);
    --border-soft:rgba(0,229,255,.08);
    --cyan:#00e5ff;
    --cyan-dim:rgba(0,229,255,.5);
    --amber:#ffb200;
    --green:#39ff14;
    --red:#ff4d5e;
    --text:#cdf4ff;
    --text-dim:rgba(205,244,255,.58);
    --text-faint:rgba(205,244,255,.35);
    --font-d:'Orbitron',sans-serif;
    --font-b:'Sarabun',sans-serif;
  }
  body.light-theme{
    --bg:#f2f6fa;
    --panel:#ffffff;
    --panel2:#eef3f8;
    --border:rgba(0,120,150,.18);
    --border-soft:rgba(0,120,150,.10);
    --cyan:#0088a8;
    --cyan-dim:rgba(0,136,168,.5);
    --amber:#b8720a;
    --green:#1a8f2f;
    --red:#c62828;
    --text:#0b2233;
    --text-dim:rgba(11,34,51,.62);
    --text-faint:rgba(11,34,51,.4);
  }
  body.light-theme{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(0,136,168,.05), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(184,114,10,.04), transparent 55%),
      var(--bg);
  }
  body.light-theme .modal,
  body.light-theme .login-box{background:#ffffff;box-shadow:0 4px 30px rgba(0,60,80,.1)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(0,229,255,.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255,178,0,.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-b);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--cyan)}
  .app{max-width:1180px;margin:0 auto;padding:18px 16px 60px}

  header.top{
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  header.top .title-block h1{
    font-family:var(--font-d);font-weight:900;font-size:20px;letter-spacing:1.2px;
    margin:0 0 4px;color:#fff;display:flex;align-items:center;gap:8px;
    text-shadow:0 0 18px rgba(0,229,255,.25);
  }
  .ro-pill{
    font-family:var(--font-b);font-size:11px;font-weight:700;letter-spacing:.3px;
    color:var(--cyan);border:1px solid rgba(0,229,255,.4);background:rgba(0,229,255,.08);
    padding:3px 9px;border-radius:20px;
  }
  header.top .title-block p{margin:0;font-size:12.5px;color:var(--text-faint)}

  .stats{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
  .stat{
    flex:1 1 130px;min-width:130px;background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:12px 14px;
  }
  .stat .num{font-family:var(--font-d);font-size:26px;font-weight:700;color:#fff;line-height:1}
  .stat .lbl{font-size:11.5px;color:var(--text-dim);margin-top:6px;letter-spacing:.2px}
  .stat.overdue .num{color:var(--red)}
  .stat.progress .num{color:var(--amber)}
  .stat.done .num{color:var(--green)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input[type=search]{
    flex:1 1 200px;min-width:160px;background:var(--panel);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:9px 12px;font-family:var(--font-b);font-size:14px;
  }
  .toolbar input[type=search]::placeholder{color:var(--text-faint)}
  .chip-group{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font-size:12.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--border);
    background:transparent;color:var(--text-dim);cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:rgba(0,229,255,.15);border-color:var(--cyan);color:#fff}
  .toolbar select{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 10px;font-family:var(--font-b);font-size:13px;
  }

  .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  thead th{
    text-align:left;font-size:11px;letter-spacing:.4px;color:var(--text-faint);
    padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:middle}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:rgba(0,229,255,.04)}
  tbody tr:last-child td{border-bottom:none}
  .job-code{font-family:var(--font-d);font-size:12.5px;color:var(--cyan);letter-spacing:.5px}
  .job-name{font-weight:600;color:#fff}
  .job-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px}
  .type-pill{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;border:1px solid;letter-spacing:.2px}
  .type-pill.prototype{color:var(--cyan);border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.06)}
  .type-pill.mold{color:var(--amber);border-color:rgba(255,178,0,.4);background:rgba(255,178,0,.06)}

  .progress-cell{min-width:160px}
  .progress-track{height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:5px}
  .progress-fill{height:100%;border-radius:4px;background:var(--cyan)}
  .progress-fill.overdue{background:var(--red)}
  .progress-fill.done{background:var(--green)}
  .progress-fill.hold{background:var(--text-faint)}
  .stage-name{font-size:11.5px;color:var(--text-dim)}

  .badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:.2px;display:inline-block;white-space:nowrap}
  .badge.in_progress{background:rgba(0,229,255,.12);color:var(--cyan)}
  .badge.overdue{background:rgba(255,77,94,.14);color:var(--red)}
  .badge.near{background:rgba(255,178,0,.14);color:var(--amber)}
  .badge.done{background:rgba(57,255,20,.12);color:var(--green)}
  .badge.hold{background:rgba(255,255,255,.06);color:var(--text-dim)}

  .due-date{font-size:12.5px}
  .due-date.overdue{color:var(--red);font-weight:700}
  .due-date.near{color:var(--amber);font-weight:700}

  .empty-state{padding:50px 20px;text-align:center;color:var(--text-faint);font-size:14px}

  .overlay{
    position:fixed;inset:0;background:rgba(0,5,12,.82);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:16px;
    opacity:0;pointer-events:none;transition:opacity .15s;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .modal{
    width:min(560px,100%);max-height:88vh;overflow-y:auto;
    background:#03101e;border:1px solid rgba(0,229,255,.35);border-radius:10px;
    padding:22px;box-shadow:0 0 50px rgba(0,229,255,.12);
  }
  .modal h2{font-family:var(--font-d);font-size:16px;letter-spacing:1px;color:#fff;margin:0 0 16px}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
  .detail-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:16px;line-height:1.7}
  .detail-meta b{color:var(--text)}
  .timeline{list-style:none;margin:0 0 18px;padding:0}
  .timeline li{position:relative;padding:0 0 18px 26px;border-left:2px solid var(--border)}
  .timeline li:last-child{border-left-color:transparent;padding-bottom:0}
  .timeline .dot{
    position:absolute;left:-7px;top:0;width:12px;height:12px;border-radius:50%;
    background:var(--panel2);border:2px solid var(--text-faint);
  }
  .timeline li.done .dot{background:var(--green);border-color:var(--green)}
  .timeline li.current .dot{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,229,255,.18)}
  .timeline .stage-title{font-size:14px;font-weight:600;color:var(--text-faint)}
  .timeline li.done .stage-title{color:var(--text)}
  .timeline li.current .stage-title{color:#fff}
  .timeline .stage-time{font-size:11.5px;color:var(--text-faint);margin-top:2px}
  .history-log{
    background:var(--panel2);border:1px solid var(--border-soft);border-radius:6px;
    padding:10px 12px;font-size:12px;color:var(--text-dim);max-height:140px;overflow-y:auto;
  }
  .history-log div{padding:4px 0;border-bottom:1px solid var(--border-soft)}
  .history-log div:last-child{border-bottom:none}
  .section-label{font-size:11px;letter-spacing:.4px;color:var(--text-faint);margin:16px 0 8px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .btn-ghost{
    font-family:var(--font-b);font-size:13px;background:transparent;
    border:1px solid var(--border);color:var(--text-dim);border-radius:6px;
    padding:8px 12px;cursor:pointer;
  }
  .btn-ghost:hover{border-color:var(--cyan-dim);color:var(--text)}

  .sync-badge{
    position:fixed;bottom:10px;right:10px;z-index:99999;
    font-family:var(--font-b);font-size:11px;padding:5px 10px;border-radius:4px;
    background:rgba(0,20,40,.9);border:1px solid rgba(0,229,255,.4);
    letter-spacing:.3px;pointer-events:none;opacity:.9;
  }

  @media (max-width:640px){
    header.top{flex-direction:column;align-items:stretch}
    .stat{min-width:110px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title-block">
      <h1>งานต้นแบบ &amp; แม่พิมพ์ <span class="ro-pill">👁 ดูอย่างเดียว</span></h1>
      <p>ดูสถานะงานแบบเรียลไทม์ — ไม่ต้องเข้าสู่ระบบ, แก้ไขไม่ได้</p>
    </div>
    <button class="btn-ghost" id="themeToggleBtn" onclick="toggleTheme()"></button>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">งานทั้งหมด</div></div>
    <div class="stat progress"><div class="num" id="statProgress">0</div><div class="lbl">กำลังดำเนินการ</div></div>
    <div class="stat overdue"><div class="num" id="statOverdue">0</div><div class="lbl">เลยกำหนด</div></div>
    <div class="stat done"><div class="num" id="statDone">0</div><div class="lbl">เสร็จแล้ว</div></div>
  </div>

  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="ค้นหารหัสงาน, ชื่องาน, ลูกค้า, ผู้รับผิดชอบ..." oninput="render()">
    <div class="chip-group" id="typeChips">
      <button class="chip active" data-type="all" onclick="setTypeFilter('all')">ทั้งหมด</button>
      <button class="chip" data-type="prototype" onclick="setTypeFilter('prototype')">ต้นแบบ</button>
      <button class="chip" data-type="mold" onclick="setTypeFilter('mold')">แม่พิมพ์</button>
    </div>
    <select id="statusFilter" onchange="render()">
      <option value="all">ทุกสถานะ</option>
      <option value="in_progress">กำลังดำเนินการ</option>
      <option value="near">ใกล้ครบกำหนด</option>
      <option value="overdue">เลยกำหนด</option>
      <option value="hold">พักงาน</option>
      <option value="done">เสร็จแล้ว</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>รหัสงาน / ชื่องาน</th>
          <th>ประเภท</th>
          <th>ความคืบหน้า</th>
          <th>ผู้รับผิดชอบ</th>
          <th>กำหนดเสร็จ</th>
          <th>สถานะ</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="detail-head">
      <h2 id="detailTitle">รายละเอียดงาน</h2>
      <span class="type-pill" id="detailTypePill"></span>
    </div>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="section-label">ขั้นตอนงาน</div>
    <ul class="timeline" id="timelineList"></ul>
    <div class="section-label">ประวัติการอัปเดต</div>
    <div class="history-log" id="historyLog"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('detailOverlay')">ปิด</button>
    </div>
  </div>
</div>

<script>
  const TYPE_LABEL = { prototype: '🧪 ต้นแบบ', mold: '🛠 แม่พิมพ์' };
  const STORE_KEY = 'mold_job_tracker_jobs_v1'; // ใช้ key เดียวกับแอปหลัก เพื่อให้อ่าน cache ล่าสุดได้ทันทีถ้าเปิดบนเครื่องเดียวกัน
  const THEME_KEY = 'mold_ro_theme';

  function applyTheme(t) {
    document.body.classList.toggle('light-theme', t === 'light');
    document.getElementById('themeToggleBtn').textContent = t === 'light' ? '🌙 โหมดมืด' : '☀️ โหมดสว่าง';
  }
  function toggleTheme() {
    const next = localStorage.getItem(THEME_KEY) === 'light' ? 'dark' : 'light';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  }
  applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark');

  let jobs = [];
  let currentDetailId = null;
  let typeFilter = 'all';

  function computeStatus(job) {
    if (job.finishedDate) return 'done';
    if (job.onHold) return 'hold';
    const due = new Date(job.dueDate + 'T23:59:59');
    const now = new Date();
    if (due < now) return 'overdue';
    const diffDays = (due - now) / 86400000;
    if (diffDays <= 3) return 'near';
    return 'in_progress';
  }
  const STATUS_LABEL = {
    in_progress: 'กำลังดำเนินการ', overdue: 'เลยกำหนด', near: 'ใกล้ครบกำหนด',
    done: 'เสร็จแล้ว', hold: 'พักงาน'
  };

  function render() {
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    const statusF = document.getElementById('statusFilter').value;

    let list = jobs.filter(j => {
      if (typeFilter !== 'all' && j.jobType !== typeFilter) return false;
      if (statusF !== 'all' && computeStatus(j) !== statusF) return false;
      if (q) {
        const hay = [j.jobCode, j.jobName, j.customer, j.assignee].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    document.getElementById('statTotal').textContent = jobs.length;
    document.getElementById('statProgress').textContent = jobs.filter(j => ['in_progress', 'near'].includes(computeStatus(j))).length;
    document.getElementById('statOverdue').textContent = jobs.filter(j => computeStatus(j) === 'overdue').length;
    document.getElementById('statDone').textContent = jobs.filter(j => computeStatus(j) === 'done').length;

    const tbody = document.getElementById('tbody');
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">${jobs.length ? 'ไม่พบงานที่ตรงกับตัวกรอง' : 'ยังไม่มีข้อมูลงาน หรือกำลังโหลด...'}</div></td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(j => {
      const status = computeStatus(j);
      const total = j.stages.length;
      const doneCount = j.finishedDate ? total : j.currentStageIndex;
      const pct = Math.round((doneCount / total) * 100);
      const fillClass = status === 'overdue' ? 'overdue' : status === 'done' ? 'done' : status === 'hold' ? 'hold' : '';
      const dueClass = status === 'overdue' ? 'overdue' : status === 'near' ? 'near' : '';
      const stageLabel = j.finishedDate ? 'เสร็จสมบูรณ์' : j.stages[j.currentStageIndex];

      return `
        <tr onclick="openDetailModal('${j.id}')">
          <td>
            <div class="job-code">${j.jobCode}</div>
            <div class="job-name">${escapeHtml(j.jobName)}</div>
            ${j.customer ? `<div class="job-sub">${escapeHtml(j.customer)}</div>` : ''}
          </td>
          <td><span class="type-pill ${j.jobType}">${TYPE_LABEL[j.jobType]}</span></td>
          <td class="progress-cell">
            <div class="progress-track"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
            <div class="stage-name">${stageLabel} (${doneCount}/${total})</div>
          </td>
          <td>${escapeHtml(j.assignee) || '—'}</td>
          <td><span class="due-date ${dueClass}">${formatDate(j.dueDate)}</span></td>
          <td><span class="badge ${status}">${STATUS_LABEL[status]}</span></td>
        </tr>`;
    }).join('');
  }

  function setTypeFilter(t) {
    typeFilter = t;
    document.querySelectorAll('#typeChips .chip').forEach(c => c.classList.toggle('active', c.dataset.type === t));
    render();
  }

  function openDetailModal(id) {
    currentDetailId = id;
    const j = jobs.find(x => x.id === id);
    if (!j) return;

    document.getElementById('detailTitle').textContent = j.jobCode + ' — ' + j.jobName;
    document.getElementById('detailTypePill').className = 'type-pill ' + j.jobType;
    document.getElementById('detailTypePill').textContent = TYPE_LABEL[j.jobType];

    document.getElementById('detailMeta').innerHTML = `
      <b>ลูกค้า:</b> ${escapeHtml(j.customer) || '—'} &nbsp;|&nbsp;
      <b>ผู้รับผิดชอบ:</b> ${escapeHtml(j.assignee) || '—'}<br>
      <b>เริ่ม:</b> ${formatDate(j.startDate)} &nbsp;|&nbsp;
      <b>กำหนดเสร็จ:</b> ${formatDate(j.dueDate)}
      ${j.finishedDate ? ` &nbsp;|&nbsp; <b>เสร็จจริง:</b> ${formatDate(j.finishedDate)}` : ''}
      ${j.notes ? `<br><b>หมายเหตุ:</b> ${escapeHtml(j.notes)}` : ''}
    `;

    document.getElementById('timelineList').innerHTML = j.stages.map((s, i) => {
      const cls = j.finishedDate || i < j.currentStageIndex ? 'done' : (i === j.currentStageIndex ? 'current' : '');
      const hist = j.history.find(h => h.stageIndex === i);
      const timeStr = hist
        ? (hist.completedAt ? 'เสร็จ ' + formatDateTime(hist.completedAt) : 'เริ่ม ' + formatDateTime(hist.startedAt))
        : '';
      return `<li class="${cls}"><div class="dot"></div><div class="stage-title">${s}</div><div class="stage-time">${timeStr}</div></li>`;
    }).join('');

    document.getElementById('historyLog').innerHTML = j.history.slice().reverse().map(h => {
      const line = h.completedAt
        ? `<b>${h.stageName}</b> เสร็จเมื่อ ${formatDateTime(h.completedAt)}`
        : `<b>${h.stageName}</b> เริ่มเมื่อ ${formatDateTime(h.startedAt)}`;
      return `<div>${line}${h.note ? ' — ' + escapeHtml(h.note) : ''}</div>`;
    }).join('') || '<div>ยังไม่มีประวัติ</div>';

    openModal('detailOverlay');
  }

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', (e) => { if (e.target === ov) ov.classList.remove('open'); });
  });

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function formatDateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short' }) + ' ' +
      d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  }

  // ── load cached copy first for instant paint, Firestore keeps it fresh ──
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) jobs = JSON.parse(raw);
  } catch (e) { /* ignore corrupt cache */ }
  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw-jobtracker.js').catch(() => {});
  }

  function badge(text, ok) {
    let el = document.getElementById('roSyncBadge');
    if (!el) {
      el = document.createElement('div');
      el.id = 'roSyncBadge';
      el.className = 'sync-badge';
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.style.color = ok ? 'var(--green)' : 'var(--amber)';
    el.style.borderColor = ok ? 'rgba(57,255,20,.5)' : 'rgba(255,178,0,.5)';
  }

  // ── read-only Firestore listener (no login) ──────────────
  (function () {
    const cfg = window.FIREBASE_CONFIG || {};
    const ownerUid = window.MOLD_OWNER_UID;
    if (!cfg.apiKey || cfg.apiKey === 'YOUR_API_KEY') {
      badge('ยังไม่ได้ตั้งค่า Firebase', false);
      return;
    }
    if (!ownerUid || ownerUid === 'YOUR_UID') {
      badge('ยังไม่ได้ตั้งค่า MOLD_OWNER_UID', false);
      return;
    }
    firebase.initializeApp(cfg, 'moldTrackerRO');
    const db = firebase.app('moldTrackerRO').firestore();

    badge('กำลังโหลด...', false);
    db.collection('mold_jobs_sync').doc(ownerUid).onSnapshot((snap) => {
      if (!snap.exists) { badge('ยังไม่มีข้อมูล', false); return; }
      try {
        const remote = snap.data();
        jobs = JSON.parse(remote.jobsJson || '[]');
        localStorage.setItem(STORE_KEY, remote.jobsJson);
        render();
        badge('อัปเดตล่าสุด', true);
      } catch (e) {
        console.error('[readonly-sync] parse failed', e);
        badge('โหลดข้อมูลไม่สำเร็จ', false);
      }
    }, (err) => {
      console.error('[readonly-sync] listener error', err);
      badge('เชื่อมต่อไม่ได้ (ตรวจ Firestore rules)', false);
    });
  })();
</script>
</body>
</html>
